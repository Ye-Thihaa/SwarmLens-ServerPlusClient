      - key: GOSSIP_RPC_TIMEOUT
        value: "10.0"
      - key: RAFT_HEARTBEAT
        value: "1.0"
      - key: RAFT_ELECTION_MIN
        value: "3.0"
      - key: RAFT_ELECTION_MAX
        value: "6.0"
      - key: RAFT_RPC_TIMEOUT
        value: "1.0"
      - key: BLOB_SYNC_INTERVAL
        value: "5.0"
      - key: BLOB_RPC_TIMEOUT
        value: "30.0"
      - key: OPERATOR_TOKEN
        sync: false
      - key: SUPABASE_URL
