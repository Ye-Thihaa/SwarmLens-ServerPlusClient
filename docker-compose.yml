# Three identical nodes, same image, behaviour set entirely by env vars.
#
# Data lives in ./data (NOT the ./node*.db files a manual `uvicorn` run
# uses) -- the two are separate clusters with separate databases. Copy
# node*.db into ./data/ if you want a docker run to start from the same
# state a manual run left behind.
#
# ./models is mounted rather than baked into the image: .dockerignore
# excludes it (~154MB of pretrained weights), so without this mount each
# of the three containers would download its own copy on the first
# /analyze call. Mounting shares one set and makes a cold start instant.
#
# All three declare the SAME `image:` name, so compose builds it once and
# reuses it rather than producing three byte-identical 1.5GB images. It is
# also what the nodes are meant to be: one image, three configurations.
services:
  node1:
    build: .
    image: swarmlens-node:local
    environment:
      NODE_ID: node1
      DB_PATH: /data/node1.db
      SELF_URL: http://node1:8000
      PEERS: http://node2:8000,http://node3:8000
      GOSSIP_INTERVAL: "1.0"
    ports: ["8001:8000"]
    volumes: ["./data:/data", "./models:/app/models"]

  node2:
    build: .
    image: swarmlens-node:local
    environment:
      NODE_ID: node2
      DB_PATH: /data/node2.db
      SELF_URL: http://node2:8000
      PEERS: http://node1:8000,http://node3:8000
      GOSSIP_INTERVAL: "1.0"
    ports: ["8002:8000"]
    volumes: ["./data:/data", "./models:/app/models"]

  node3:
    build: .
    image: swarmlens-node:local
    environment:
      NODE_ID: node3
      DB_PATH: /data/node3.db
      SELF_URL: http://node3:8000
      PEERS: http://node1:8000,http://node2:8000
      GOSSIP_INTERVAL: "1.0"
    ports: ["8003:8000"]
    volumes: ["./data:/data", "./models:/app/models"]
