# Builds the node image once and publishes it to GitHub Container Registry,
# so Render (or anything else) can deploy a prebuilt image instead of
# rebuilding the same Dockerfile per service.
#
# Why this exists rather than letting Render build: the cluster runs three
# IDENTICAL services. Pointing all three at one image means they provably
# run the same bytes -- a version skew between nodes is exactly the kind of
# bug this system is hard to debug for, since a node behaving differently
# looks like a distributed-systems fault rather than a stale build. It also
# turns three ~5-minute image builds into three pulls.
#
# Auth is GITHUB_TOKEN, which Actions injects automatically -- no registry
# credentials are stored anywhere in this repo.
name: Publish node image

on:
  push:
    branches: [master, main, recap-and-blob-storage]
    # Docs-only pushes don't change the image; skip the build.
    paths-ignore:
      - "**/*.md"
      - "client/**"
      - "client-2/**"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # buildx enables the registry-backed layer cache below. Without it the
      # ~370MB of wheels (onnxruntime, mediapipe, opencv) recompile from
      # scratch on every run.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` for convenience, the commit SHA so a deploy can be
          # pinned to an exact build and rolled back to one.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
